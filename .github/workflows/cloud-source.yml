name: Manual cloud source check
run-name: One-round anonymous source check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-cloud-source
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install this version outside checkout
        run: |
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/canary-wheels"
          python -m venv "$RUNNER_TEMP/canary-package"
          "$RUNNER_TEMP/canary-package/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/canary-wheels/*.whl
      - name: One fixed round, aggregate-only evidence
        run: |
          "$RUNNER_TEMP/canary-package/bin/python" -I scripts/check_cloud_access.py --version-file VERSION
