# Fresh bounded business-hours campaign. Never reuse the old ungated campaign volume.
services:
  collector:
    command:
      - remote-campaign-serve
      - --root
      - /state/campaign
      - --plan-file
      - /state/plans.json
      - --business-hours-file
      - /opt/sushiwait/default-business-hours.json
      - --store-id
      - "3014"
      - --store-id
      - "3004"
      - --store-id
      - "2009"
      - --base-interval
      - "60"
      - --duration
      - "172800"
      - --window-duration
      - "86400"
      - --max-pairs
      - "4500"
      - --resume-if-present
      - --listen-host
      - 0.0.0.0
      - --port
      - "8765"
    restart: "on-failure:3"
