# Explicit fresh multi-day project; initialize its private plan feed before up.
services:
  collector:
    command:
      - remote-campaign-serve
      - --root
      - /state/campaign
      - --plan-file
      - /state/plans.json
      - --plan-updates-file
      - /plan-updates/current.json
      - --store-id
      - "3014"
      - --store-id
      - "3004"
      - --store-id
      - "2009"
      - --base-interval
      - "300"
      - --duration
      - "604800"
      - --window-duration
      - "86400"
      - --max-pairs
      - "6300"
      - --resume-if-present
      - --listen-host
      - 0.0.0.0
      - --port
      - "8765"
    volumes:
      - plan_updates:/plan-updates
volumes:
  plan_updates:
