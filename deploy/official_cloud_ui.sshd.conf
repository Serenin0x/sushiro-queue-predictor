# Prepared only. Install for the dedicated sw-cloud-ui user after approval.
# Validate with sshd -t AND sshd -T -C before reloading the SSH service.
# The separate key must also pin PermitOpen and expire at the trial deadline.
# A per-key port-forwarding option alone would also permit remote forwarding.
Match User sw-cloud-ui
    AuthenticationMethods publickey
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:18081
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    MaxSessions 0
Match all
