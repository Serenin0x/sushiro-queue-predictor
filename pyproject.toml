[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sushiwait"
version = "0.3.0.dev1"
description = "Mainland Sushiro read-only data and private outcome tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "docs/design/previews/engineering-20261013/TABLER-ICONS-LICENSE.txt"]
dependencies = []

[project.optional-dependencies]
server = ["uvicorn==0.53.0"]
protocol = ["cryptography==50.0.2"]
screenshot = ["Pillow==12.3.0"]

[project.scripts]
sushiwait = "sushiwait.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sushiwait = ["data/*.json", "web/*.html", "web/*.css", "web/*.js", "web/*.mjs", "web/*.svg", "web/*.json"]
